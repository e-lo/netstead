site_name: "Netstead + corral"
site_description: "Umbrella landing — pick corral or netstead."
site_url: https://e-lo.github.io/netstead
repo_url: https://github.com/e-lo/netstead
edit_uri: edit/main/docs

# Tiny umbrella site — one page that routes to each package's own
# documentation site. The substantive docs live in each package:
#
#   packages/corral/docs/  → built independently → deployed at /corral/
#   packages/netstead/docs/     → built independently → deployed at /netstead/
#
# See packages/corral/mkdocs.yml + packages/netstead/mkdocs.yml for
# the actual content sites.

theme:
  name: material
  features:
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg

exclude_docs: |
  design/

nav:
  - Home: index.md
