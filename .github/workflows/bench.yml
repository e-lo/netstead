name: Bench

# Performance regression guard.
#
# Runs pytest-benchmark on PRs that touch performance-critical paths,
# stores the JSON output as a workflow artifact, and compares against
# the most recent main-branch baseline (fetched from prior runs of
# this workflow). Fails if any benchmark regresses >2x vs baseline.
#
# Discovers bench tests (`@pytest.mark.perf`, `tests/bench/`, or
# `test_bench_*.py`); if none are found the bench-run step is a no-op,
# which is reported clearly in the job log.
#
# When benchmark JSON exists, a summary table (current vs baseline) is
# posted as a PR comment, updated in place on later pushes. The comment
# is skipped for fork PRs, whose token is read-only.

on:
  pull_request:
    paths:
      - 'packages/corral/corral/engines/**'
      - 'packages/corral/corral/io/**'
      - 'packages/corral/corral/validation/**'
      - 'packages/corral/corral/dataset/**'
      - 'packages/netstead/netstead/network.py'
      - 'packages/netstead/netstead/quality/**'
      - 'packages/netstead/netstead/scope/**'
      - 'packages/netstead/netstead/indexes/**'
      - '.github/workflows/bench.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.13'
      - name: Install workspace
        # --all-extras matches tests.yml so doctest-modules collection
        # works the same and optional-dep bench paths are importable.
        # pytest-benchmark is already in [dependency-groups].dev.
        run: uv sync --all-packages --all-extras

      - name: Discover bench tests
        id: discover
        # Look for explicit perf marker first, then tests/bench/ dirs,
        # then test_bench_*.py files. Sets `found=true` and a `paths`
        # output for the run step to consume.
        run: |
          set -e
          if uv run pytest --collect-only -q -m perf 2>/dev/null | grep -q '::'; then
            echo "mode=marker" >> "$GITHUB_OUTPUT"
            echo "found=true"  >> "$GITHUB_OUTPUT"
          elif find packages -type d -path '*/tests/bench' | grep -q .; then
            echo "mode=dir"    >> "$GITHUB_OUTPUT"
            echo "found=true"  >> "$GITHUB_OUTPUT"
          elif find packages -name 'test_bench_*.py' | grep -q .; then
            echo "mode=glob"   >> "$GITHUB_OUTPUT"
            echo "found=true"  >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "no bench tests found — skipping the bench run"
          fi

      - name: Download baseline (most recent main-branch run)
        if: steps.discover.outputs.found == 'true'
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: bench.yml
          branch: main
          name_is_regexp: true
          name: '^bench-.*\.json$'
          path: .benchmarks/baseline
          if_no_artifact_found: warn

      - name: Run benchmarks
        if: steps.discover.outputs.found == 'true'
        # Two perf-test conventions are supported:
        #   1. Tests using the pytest-benchmark `benchmark` fixture
        #      (microbenchmarks; pytest-benchmark collects + saves JSON).
        #   2. Tests marked `@pytest.mark.perf` that do their own
        #      wall-clock assertion (regression bounds — e.g.
        #      test_merge_close_nodes_scales_to_1k_nodes_in_under_2s).
        #
        # For (1) `--benchmark-compare-fail=mean:200%` trips if mean
        # is >2x baseline. For (2) the test's own assert is the guard.
        # `PytestBenchmarkWarning: no benchmarks have been run` fires
        # when only (2)-style tests collected — expected, not a failure.
        run: |
          mkdir -p .benchmarks
          BASELINE=""
          if compgen -G ".benchmarks/baseline/*.json" > /dev/null; then
            cp .benchmarks/baseline/*.json .benchmarks/
            BASELINE="--benchmark-compare --benchmark-compare-fail=mean:200%"
          fi
          case "${{ steps.discover.outputs.mode }}" in
            marker) TARGET="-m perf" ;;
            dir)    TARGET="packages/*/tests/bench" ;;
            glob)   TARGET="-k bench_" ;;
          esac
          uv run pytest $TARGET \
            -W ignore::pytest_benchmark.logger.PytestBenchmarkWarning \
            --benchmark-json=.benchmarks/bench-${{ github.sha }}.json \
            $BASELINE

      - name: Upload bench results
        if: steps.discover.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}.json
          path: .benchmarks/bench-${{ github.sha }}.json
          retention-days: 90

      - name: Build PR comment
        id: comment
        # Runs even when the benchmark step failed on a regression, so the
        # table explains the failure. Writes nothing (has_body=false) when
        # there is no benchmark JSON, e.g. only wall-clock perf tests ran.
        if: always() && steps.discover.outputs.found == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BENCH_JSON: .benchmarks/bench-${{ github.sha }}.json
          BODY_FILE: ${{ runner.temp }}/bench-comment.md
        run: |
          uv run python - <<'PY'
          import glob
          import json
          import os

          current_path = os.environ["BENCH_JSON"]
          if not os.path.exists(current_path):
              print("no benchmark JSON; skipping PR comment")
              raise SystemExit(0)

          def means(path):
              # pytest-benchmark leaves an empty file when only wall-clock
              # perf tests ran (no benchmark fixture), so empty means none.
              try:
                  with open(path) as f:
                      data = json.load(f)
              except (OSError, json.JSONDecodeError):
                  return {}
              return {b["fullname"]: b["stats"]["mean"] for b in data.get("benchmarks", [])}

          current = means(current_path)
          if not current:
              print("no benchmarks recorded; skipping PR comment")
              raise SystemExit(0)

          baseline = {}
          baseline_files = sorted(glob.glob(".benchmarks/baseline/*.json"))
          if baseline_files:
              baseline = means(baseline_files[-1])

          def fmt(seconds):
              return f"{seconds * 1000:.3f} ms"

          lines = [
              "<!-- netstead-bench-comment -->",
              "### Benchmark results",
              "",
          ]
          if baseline:
              lines += [
                  "| Benchmark | Baseline | Current | Change |",
                  "| --- | ---: | ---: | ---: |",
              ]
          else:
              lines += [
                  "No baseline from `main` was available; showing current means only.",
                  "",
                  "| Benchmark | Current |",
                  "| --- | ---: |",
              ]
          for name in sorted(current):
              now = current[name]
              before = baseline.get(name)
              if not baseline:
                  lines.append(f"| `{name}` | {fmt(now)} |")
              elif before:
                  change = (now / before - 1) * 100
                  flag = " :warning:" if now > 2 * before else ""
                  lines.append(f"| `{name}` | {fmt(before)} | {fmt(now)} | {change:+.1f}%{flag} |")
              else:
                  lines.append(f"| `{name}` | n/a | {fmt(now)} | new |")
          lines += ["", f"Mean time per benchmark; the job fails above 2x baseline. Commit {os.environ.get('GITHUB_SHA', '')[:7]}."]
          with open(os.environ["BODY_FILE"], "w") as f:
              f.write("\n".join(lines) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("has_body=true\n")
          PY

      - name: Post PR comment
        if: always() && steps.comment.outputs.has_body == 'true'
        uses: actions/github-script@v7
        env:
          BODY_FILE: ${{ runner.temp }}/bench-comment.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- netstead-bench-comment -->';
            const body = fs.readFileSync(process.env.BODY_FILE, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
