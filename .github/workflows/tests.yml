name: Tests

on:
  push:
    branches: [main, develop, "refactor/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages
      - name: Ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Import-linter (architectural boundaries)
        run: uv run lint-imports
      - name: No raw SQL outside corral.engines.ibis_engine
        run: uv run python scripts/lint_no_sql.py

  wheel-smoke:
    # Build the netstead wheel and verify the bundled Leavenworth fixture
    # binaries (parquet/duckdb/csv/zip + datapackage.json) are actually
    # present inside the wheel. Guards I3 — packaging regression that
    # would silently drop the fixtures from the wheel.
    #
    # Notes:
    # * We inspect wheel members directly rather than `pip install` the
    #   wheel, because `corral` is workspace-local and not on PyPI yet
    #   (an install would fail dependency resolution). Once corral is
    #   published, swap this for a fresh-venv install + import check.
    # * Local equivalent:
    #     rm -rf /tmp/wheel-test
    #     uv build --package netstead --out-dir /tmp/wheel-test
    #     uv run python -m zipfile -l /tmp/wheel-test/netstead-*.whl \
    #         | grep -E 'fixtures.*(parquet|duckdb|\.zip|datapackage)'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build netstead wheel
        run: |
          rm -rf /tmp/wheel-test
          uv build --package netstead --out-dir /tmp/wheel-test
      - name: Verify fixture binaries packaged in wheel
        run: |
          uv run python - <<'PY'
          import sys, zipfile
          from pathlib import Path
          wheels = list(Path("/tmp/wheel-test").glob("netstead-*.whl"))
          assert len(wheels) == 1, wheels
          names = zipfile.ZipFile(wheels[0]).namelist()
          fx = "netstead/fixtures/leavenworth"
          required_files = [
              f"{fx}/datapackage.json",
              f"{fx}/leavenworth.duckdb",
              f"{fx}/leavenworth.csv.zip",
          ]
          required_globs = {
              "parquet": lambda n: n.startswith(f"{fx}/parquet/") and n.endswith(".parquet"),
              "csv":     lambda n: n.startswith(f"{fx}/csv/") and n.endswith(".csv"),
          }
          missing = [f for f in required_files if f not in names]
          if missing:
              print(f"wheel-smoke FAILED: missing required files: {missing}", file=sys.stderr)
              sys.exit(1)
          for label, pred in required_globs.items():
              n = sum(1 for x in names if pred(x))
              if n == 0:
                  print(f"wheel-smoke FAILED: no {label} files matched in wheel", file=sys.stderr)
                  sys.exit(1)
              print(f"  {label}: {n} files")
          print(f"wheel-smoke OK ({len(names)} members in {wheels[0].name})")
          PY

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python-version: '3.13'
          # One leg also measures coverage. It does so inside its single
          # test run per package (no separate coverage re-runs).
          - os: ubuntu-latest
            python-version: '3.13'
            coverage: true
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install workspace (with all extras for --doctest-modules)
        # --doctest-modules makes pytest import every module under the package
        # to scan for doctests. Modules that import optional deps at module
        # top level (api/app.py → fastapi, polars_engine.py → polars,
        # mcp/server.py → mcp) fail to import without the corresponding
        # extras. Install them all so the doctest sweep can collect every
        # file. Tests with `pytest.importorskip("…")` still skip cleanly
        # when an extra is genuinely missing.
        run: uv sync --all-packages --all-extras
      - name: Install the example Workbench plugin
        # Installed (not just imported from source) so the netstead tests
        # discover it through its real `netstead.workbench.plugins` entry
        # point. `uv run` syncs inexactly, so later steps keep it.
        run: uv pip install -e examples/workbench-plugin-hello
      # CI always runs the FULL suite: `-m ""` overrides the default
      # `not slow and not perf` filter in pyproject addopts. `-n auto` is
      # pytest-xdist (dev dep); addopts pins --dist=loadfile.
      #
      # Each package runs exactly once. On the coverage leg that same run
      # also enforces a per-package coverage gate (so a regression in one
      # package can't be masked by the other) and writes the XML for
      # codecov. Gates sit about one point below the measured coverage.
      - name: Test corral
        run: >-
          uv run pytest -m "" -n auto packages/corral/tests
          --doctest-modules packages/corral/corral
          ${{ matrix.coverage && '--cov=corral --cov-fail-under=86 --cov-report=term --cov-report=xml:coverage-corral.xml' || '' }}
      - name: Test netstead
        run: >-
          uv run pytest -m "" -n auto packages/netstead/tests
          --doctest-modules packages/netstead/netstead
          ${{ matrix.coverage && '--cov=netstead --cov-fail-under=84 --cov-report=term --cov-report=xml:coverage-netstead.xml' || '' }}
      - name: Test netstead-project-cards
        run: >-
          uv run pytest -m "" -n auto plugins/project-cards/tests
          --doctest-modules plugins/project-cards/netstead_project_cards
          ${{ matrix.coverage && '--cov=netstead_project_cards --cov-fail-under=85 --cov-report=term --cov-report=xml:coverage-project-cards.xml' || '' }}
      - name: Upload coverage
        if: matrix.coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage-corral.xml,coverage-netstead.xml,coverage-project-cards.xml
          fail_ci_if_error: false
