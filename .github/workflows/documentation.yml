name: Docs

# Builds the umbrella landing page plus each package's own site into one tree:
#   /            ← mkdocs.yml (umbrella), built with Zensical
#   /netstead/   ← packages/netstead/mkdocs.yml
#   /corral/     ← packages/corral/mkdocs.yml
# Pushes to main deploy to the gh-pages branch (served at e-lo.github.io/netstead/);
# pull requests only build, so broken docs fail the PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'  # as tests.yml's lint job: duckdb 1.1.3 has no wheel for the runner's 3.14
      - name: Install packages + docs toolchain
        run: uv sync --all-packages --all-extras --group docs
      - name: Generate build-time pages
        # Each package's main.py writes its gitignored generated pages (CLI and
        # HTTP references, llms.txt, llms-full.txt, ai/api-index.json). They
        # must exist before Zensical scans the docs folder.
        run: |
          uv run python packages/netstead/main.py
          uv run python packages/corral/main.py
      - name: Build sites
        # --strict turns every warning (such as a link to a page that does not
        # exist) into a failed build, so a warning fails the PR instead of
        # shipping. Zensical writes each site next to its config, so the two
        # package sites are copied under the umbrella site afterwards.
        run: |
          uv run zensical build --strict --clean -f mkdocs.yml
          uv run zensical build --strict --clean -f packages/netstead/mkdocs.yml
          uv run zensical build --strict --clean -f packages/corral/mkdocs.yml
          cp -R packages/netstead/site site/netstead
          cp -R packages/corral/site site/corral
      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          force_orphan: true
