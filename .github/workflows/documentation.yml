name: Docs

# Builds the umbrella landing page plus each package's own site into one tree:
#   /            ← mkdocs.yml (umbrella)
#   /netstead/   ← packages/netstead/mkdocs.yml
#   /corral/     ← packages/corral/mkdocs.yml
# Pushes to main deploy to the gh-pages branch (served at e-lo.github.io/netstead/);
# pull requests only build, so broken docs fail the PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # git-revision-date-localized needs history
      - uses: astral-sh/setup-uv@v7
      - name: Install packages + docs toolchain
        run: uv sync --all-packages --all-extras --group docs
      - name: Build sites
        # --strict turns every mkdocs / plugin warning (broken link or
        # anchor, missing docstring type, unresolved cross-reference) into
        # a failed build, so a warning fails the PR instead of shipping.
        env:
          # Material for MkDocs >= 9.7.2 prints a banner about the coming
          # MkDocs 2.0 changes on every build. It is informational, not a
          # docs problem, so keep it out of the strict build's output.
          NO_MKDOCS_2_WARNING: "1"
        run: |
          uv run mkdocs build --strict -f mkdocs.yml -d site
          uv run mkdocs build --strict -f packages/netstead/mkdocs.yml -d "$PWD/site/netstead"
          uv run mkdocs build --strict -f packages/corral/mkdocs.yml -d "$PWD/site/corral"
      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          force_orphan: true
