# Allowed OSM `highway` tag values per network type (maintained data).
#
# The Overpass query keeps only ways whose `highway` value is in the list for
# the requested network types (a build with several keeps the union). The old
# names still replay: drive -> roads; walk, bike, all -> roads + paths (see
# netstead.network_types).
#
# Deliberately absent from both lists: proposed, construction, corridor, and the
# other non-network highway values (raceway, elevator, platform, abandoned,
# disused, ...). They are not usable network, so no type ever includes them.

# Vehicle network: the drive classes plus dedicated busways.
roads:
  - motorway
  - motorway_link
  - trunk
  - trunk_link
  - primary
  - primary_link
  - secondary
  - secondary_link
  - tertiary
  - tertiary_link
  - unclassified
  - residential
  - living_street
  - service
  - road
  - busway

# Off-road and non-motorized ways.
paths:
  - bridleway
  - footway
  - path
  - pedestrian
  - steps
  - track
  - cycleway
